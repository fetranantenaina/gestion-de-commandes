<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion de commandes</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --ink: #1c2530; --muted: #5d6877;
    --line: #dde1e7; --accent: #0f5c63; --accent-ink: #ffffff;
    --pending-bg: #fdf0d2; --pending-ink: #7a5300;
    --ok-bg: #dcf1e3; --ok-ink: #17623a;
    --off-bg: #e8eaee; --off-ink: #4b5563;
    --danger: #a32626; --danger-bg: #fbe4e4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 20px 28px; background: var(--surface); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 20px; font-weight: 650; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 28px 48px; display: grid; gap: 24px;
         grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
  section { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px 20px; }
  section.wide { grid-column: 1 / -1; }
  h2 { margin: 0 0 12px; font-size: 16px; font-weight: 650; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-weight: 600; color: var(--muted); font-size: 13px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .table-scroll { overflow-x: auto; }
  input[type=number] { width: 70px; padding: 5px 6px; border: 1px solid var(--line); border-radius: 4px; font: inherit; }
  button { font: inherit; padding: 6px 12px; border-radius: 4px; border: 1px solid var(--line);
           background: var(--surface); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 13px; font-weight: 550; }
  .badge.PENDING { background: var(--pending-bg); color: var(--pending-ink); }
  .badge.VALIDATED { background: var(--ok-bg); color: var(--ok-ink); }
  .badge.CANCELLED { background: var(--off-bg); color: var(--off-ink); }
  .stock-low { color: var(--pending-ink); font-weight: 600; }
  .stock-out { color: var(--danger); font-weight: 600; }
  .empty { color: var(--muted); margin: 6px 0; }
  .cart-total { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-weight: 650; }
  .actions { display: flex; gap: 6px; }
  #notice { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: min(620px, 92vw);
            padding: 11px 16px; border-radius: 6px; font-weight: 550; display: none;
            box-shadow: 0 4px 18px rgba(0,0,0,.16); }
  #notice.ok { background: var(--ok-bg); color: var(--ok-ink); display: block; }
  #notice.error { background: var(--danger-bg); color: var(--danger); display: block; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 16px; } }
</style>
</head>
<body>
<header><h1>Gestion de commandes</h1></header>
<main>
  <section aria-labelledby="h-products">
    <h2 id="h-products">Produits</h2>
    <div class="table-scroll"><table>
      <thead><tr><th>Produit</th><th class="num">Prix unitaire</th><th class="num">Stock</th><th>Quantité</th><th></th></tr></thead>
      <tbody id="products"></tbody>
    </table></div>
  </section>

  <section aria-labelledby="h-cart">
    <h2 id="h-cart">Panier</h2>
    <div id="cart"></div>
  </section>

  <section class="wide" aria-labelledby="h-orders">
    <h2 id="h-orders">Commandes</h2>
    <div class="table-scroll"><table>
      <thead><tr><th>N°</th><th>Date</th><th>Contenu</th><th class="num">Total</th><th>Statut</th><th>Actions</th></tr></thead>
      <tbody id="orders"></tbody>
    </table></div>
  </section>
</main>
<div id="notice" role="status" aria-live="polite"></div>

<script>
const STATUS_LABELS = { PENDING: "En attente", VALIDATED: "Validée", CANCELLED: "Annulée" };
const money = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
const dateFmt = new Intl.DateTimeFormat("fr-FR", { dateStyle: "short", timeStyle: "short" });

let products = [];
let cart = {};          // product_id -> quantité
let noticeTimer;

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

function notify(message, kind = "ok") {
  const el = document.getElementById("notice");
  el.textContent = message;
  el.className = kind;
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { el.className = ""; }, 5000);
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" }, ...options,
  });
  const data = res.status === 204 ? null : await res.json();
  if (!res.ok) throw new Error(errorMessage(data, res.status));
  return data;
}

function errorMessage(data, status) {
  if (data && data.error) {
    const d = data.error.details;
    if (data.error.code === "insufficient_stock" && Array.isArray(d)) {
      return "Stock insuffisant : " + d.map(x => `${x.product_name} (demandé ${x.requested}, disponible ${x.available})`).join(" ; ");
    }
    return data.error.message;
  }
  if (data && Array.isArray(data.detail)) {            // erreurs de validation (422)
    return "Données invalides : " + data.detail.map(e => e.msg).join(" ; ");
  }
  return `Erreur ${status}`;
}

/* ---------- Produits ---------- */
function renderProducts() {
  const tbody = document.getElementById("products");
  tbody.innerHTML = products.map(p => {
    const stockClass = p.stock === 0 ? "stock-out" : p.stock <= 5 ? "stock-low" : "";
    return `<tr>
      <td>${esc(p.name)}</td>
      <td class="num">${money.format(p.unit_price)}</td>
      <td class="num ${stockClass}">${p.stock === 0 ? "Rupture" : p.stock}</td>
      <td><input type="number" min="1" value="1" id="qty-${p.id}" aria-label="Quantité de ${esc(p.name)}"></td>
      <td><button data-add="${p.id}">Ajouter</button></td>
    </tr>`;
  }).join("");
}

document.getElementById("products").addEventListener("click", e => {
  const id = e.target.dataset.add;
  if (!id) return;
  const qty = parseInt(document.getElementById(`qty-${id}`).value, 10);
  if (!Number.isInteger(qty) || qty <= 0) return notify("La quantité doit être un entier supérieur à 0.", "error");
  cart[id] = (cart[id] || 0) + qty;
  renderCart();
});

/* ---------- Panier ---------- */
function renderCart() {
  const el = document.getElementById("cart");
  const lines = Object.entries(cart);
  if (!lines.length) {
    el.innerHTML = `<p class="empty">Le panier est vide. Ajoutez des produits depuis la liste.</p>`;
    return;
  }
  let total = 0;
  const rows = lines.map(([id, qty]) => {
    const p = products.find(x => x.id == id);
    const lineTotal = p ? Number(p.unit_price) * qty : 0;
    total += lineTotal;
    return `<tr>
      <td>${esc(p ? p.name : "Produit " + id)}</td>
      <td class="num">× ${qty}</td>
      <td class="num">${money.format(lineTotal)}</td>
      <td><button data-remove="${id}" aria-label="Retirer du panier">Retirer</button></td>
    </tr>`;
  }).join("");
  el.innerHTML = `<table><tbody>${rows}</tbody></table>
    <div class="cart-total"><span>Total</span><span>${money.format(total)}</span></div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="primary" id="submit-order">Passer la commande</button>
      <button id="clear-cart">Vider</button>
    </div>`;
}

document.getElementById("cart").addEventListener("click", async e => {
  if (e.target.dataset.remove) { delete cart[e.target.dataset.remove]; renderCart(); }
  if (e.target.id === "clear-cart") { cart = {}; renderCart(); }
  if (e.target.id === "submit-order") {
    e.target.disabled = true;
    const items = Object.entries(cart).map(([id, quantity]) => ({ product_id: Number(id), quantity }));
    try {
      const order = await api("/api/orders", { method: "POST", body: JSON.stringify({ items }) });
      notify(`Commande n°${order.id} enregistrée (${money.format(order.total_amount)}).`);
      cart = {};
    } catch (err) {
      notify(err.message, "error");
    }
    await refresh();
  }
});

/* ---------- Commandes ---------- */
function renderOrders(orders) {
  const tbody = document.getElementById("orders");
  if (!orders.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty">Aucune commande pour le moment.</td></tr>`;
    return;
  }
  tbody.innerHTML = orders.map(o => `<tr>
    <td>${o.id}</td>
    <td>${dateFmt.format(new Date(o.created_at))}</td>
    <td>${o.items.map(i => `${esc(i.product_name)} × ${i.quantity}`).join(", ")}</td>
    <td class="num">${money.format(o.total_amount)}</td>
    <td><span class="badge ${o.status}">${STATUS_LABELS[o.status]}</span></td>
    <td><div class="actions">
      <button data-validate="${o.id}" ${o.status !== "PENDING" ? "disabled" : ""}>Valider</button>
      <button class="danger" data-cancel="${o.id}" ${o.status === "CANCELLED" ? "disabled" : ""}>Annuler</button>
    </div></td>
  </tr>`).join("");
}

document.getElementById("orders").addEventListener("click", async e => {
  const cancelId = e.target.dataset.cancel, validateId = e.target.dataset.validate;
  if (!cancelId && !validateId) return;
  try {
    if (cancelId) {
      await api(`/api/orders/${cancelId}/cancel`, { method: "POST" });
      notify(`Commande n°${cancelId} annulée, stock restitué.`);
    } else {
      await api(`/api/orders/${validateId}/validate`, { method: "POST" });
      notify(`Commande n°${validateId} validée.`);
    }
  } catch (err) {
    notify(err.message, "error");
  }
  await refresh();
});

async function refresh() {
  try {
    const [p, o] = await Promise.all([api("/api/products"), api("/api/orders")]);
    products = p;
    renderProducts(); renderCart(); renderOrders(o);
  } catch (err) {
    notify("Impossible de charger les données : " + err.message, "error");
  }
}
refresh();
</script>
</body>
</html>
