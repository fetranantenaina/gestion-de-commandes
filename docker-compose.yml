# Les valeurs viennent du fichier .env (voir .env.example) : rien n'est écrit en dur ici.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Définir POSTGRES_USER dans .env (voir .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env (voir .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?Définir POSTGRES_DB dans .env (voir .env.example)}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # port de la machine : modifiable dans .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Exécuté uniquement à la PREMIÈRE création du volume
      - ./db/script.sql:/docker-entrypoint-initdb.d/01-script.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Définir POSTGRES_USER dans .env (voir .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env (voir .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?Définir POSTGRES_DB dans .env (voir .env.example)}
      # Entre conteneurs : nom du service et port INTERNE de PostgreSQL
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
